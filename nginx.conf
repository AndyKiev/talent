events {
}

http {
    client_max_body_size 5M;
    server {
        listen      80;
        # ONE origin per environment: the app and the API are both served from
        # here on port 80, so the browser URL is just http://<name>/auth/login
        # and every device (phone / tablet / PC) uses the same one.
        server_name localhost
                    talent talent.awah-ua.ua.auchan.com
                    talent_test talent_test.awah-ua.ua.auchan.com;

        location / {
            proxy_pass http://frontend:4000/;
        }

        location /api/ {
            # NO trailing slash: with one, nginx rewrites /api/v1/x to /v1/x and
            # the backend (whose routes all start with /api/) answers 404.
            proxy_pass http://backend:8004;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}