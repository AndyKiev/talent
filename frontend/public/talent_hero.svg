<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Talent — управління талантами">
  <title>Talent</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213A"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2FBFA8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2FBFA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- ================= org lattice ================= -->
  <g transform="translate(600 270)">
    <circle r="200" fill="url(#glow)"/>

    <g stroke="#5A6B8C" stroke-width="2" fill="none" stroke-linecap="round">
      <!-- level 1 -->
      <path d="M0 -120 V-70"/>
      <path d="M-150 -70 H150"/>
      <path d="M-150 -70 V-20"/>
      <path d="M0 -70 V-20"/>
      <path d="M150 -70 V-20"/>
      <!-- level 2 -->
      <path d="M-210 30 H-90"/>
      <path d="M-150 -20 V30"/>
      <path d="M-210 30 V75"/>
      <path d="M-90 30 V75"/>

      <path d="M-60 30 H60"/>
      <path d="M0 -20 V30"/>
      <path d="M-60 30 V75"/>
      <path d="M60 30 V75"/>

      <path d="M90 30 H210"/>
      <path d="M150 -20 V30"/>
      <path d="M90 30 V75"/>
      <path d="M210 30 V75"/>
    </g>

    <!-- department nodes -->
    <g fill="#16213A" stroke="#5A6B8C" stroke-width="2.5">
      <rect x="-172" y="-32" width="44" height="24" rx="6"/>
      <rect x="-22" y="-32" width="44" height="24" rx="6"/>
      <rect x="128" y="-32" width="44" height="24" rx="6"/>
    </g>

    <!-- employee leaves -->
    <g fill="#E8B33C">
      <circle cx="-210" cy="84" r="9"/>
      <circle cx="-90" cy="84" r="9"/>
      <circle cx="-60" cy="84" r="9"/>
      <circle cx="60" cy="84" r="9"/>
      <circle cx="210" cy="84" r="9"/>
    </g>

    <!-- the one being reviewed -->
    <circle cx="0" cy="84" r="16" fill="#2FBFA8"/>
    <circle cx="0" cy="84" r="26" fill="none" stroke="#2FBFA8" stroke-opacity=".45" stroke-width="2"/>

    <!-- root -->
    <circle cx="0" cy="-140" r="22" fill="#F5F3EE"/>
    <circle cx="0" cy="-140" r="30" fill="none" stroke="#F5F3EE" stroke-opacity=".2" stroke-width="2"/>
  </g>

  <!-- ================= wordmark ================= -->
  <g transform="translate(90 214)">
    <rect x="0" y="-34" width="46" height="3" fill="#E8B33C"/>
    <text x="0" y="42" fill="#F5F3EE"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="82" font-weight="400" letter-spacing="14">TALENT</text>
    <text x="4" y="86" fill="#8FA0BE"
          font-family="Helvetica, Arial, sans-serif"
          font-size="17" letter-spacing="4">УПРАВЛІННЯ ТАЛАНТАМИ</text>
    <text x="4" y="140" fill="#5A6B8C"
          font-family="Helvetica, Arial, sans-serif"
          font-size="15" letter-spacing="1">Структура · Посади · Аудит талантів · Оцінка</text>
  </g>
</svg>
