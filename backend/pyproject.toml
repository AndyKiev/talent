[tool.poetry]
name = "talent"
version = "0.1.0"
description = ""
authors = ["Andrey Bakulin <abakulin@auchan.ua>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-multipart = ">=0.0.20,<0.0.21"
fastapi = { extras = ["standart"], version = ">=0.117.1,<0.118.0" }
uvicorn = { extras = ["standart"], version = ">=0.37.0,<0.38.0" }
ldap3 = ">=2.9.1,<3.0.0"
pyjwt = "^2.9.0"
pydantic-settings = ">=2.11.0,<3.0.0"
pydantic = {extras = ["email"], version = "^2.12.3"}
sqlalchemy = ">=2.0.43,<3.0.0"
oracledb = ">=3.3.0,<4.0.0"
sshtunnel = ">=0.4.0,<0.5.0"
aiosqlite = "^0.21.0"
alembic = "^1.17.0"
celery = ">=5.5.3,<6.0.0"
flower = ">=2.0.1,<3.0.0"
redis = ">=5.0.0,<6.0.0"
aiosmtplib = ">=4.0.1,<5.0.0"
openpyxl = "^3.1.5"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"
orjson = "^3.11.8"
pillow = "^12.2.0"
matplotlib = "^3.11.0"
python-pptx = "^1.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "pytest (>=9.0.1,<10.0.0)"
]
