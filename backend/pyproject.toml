[tool.poetry]
name = "talent"
version = "0.1.0"
description = ""
authors = ["Andrey Bakulin <abakulin@auchan.ua>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-multipart = ">=0.0.20,<0.0.21"
fastapi = { extras = ["standard"], version = ">=0.135.0" }
uvicorn = { extras = ["standard"], version = ">=0.44.0" }
pyjwt = "^2.9.0"
pydantic-settings = ">=2.11.0,<3.0.0"
pydantic = { extras = ["email"], version = "^2.12.3" }
sqlalchemy = ">=2.0.43,<3.0.0"
alembic = "^1.17.0"
orjson = "^3.11.3"
openpyxl = "^3.1.5"
pandas = "^2.3.3"
celery = ">=5.5.3,<6.0.0"
redis = ">=5.0.0,<6.0.0"
aiosmtplib = ">=4.0.1,<5.0.0"
psycopg2-binary = "^2.9.0"
asyncpg = "^0.31.0"
bcrypt = "^5.0.0"
ldap3 = "^2.9.1"


[dependency-groups]
dev = [
    "black>=25.9.0,<26.0.0",
    "pytest>=9.0.1,<10.0.0",
    "cryptography (>=46.0.7,<47.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"