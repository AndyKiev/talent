[tool.poetry]
name = "talent"
version = "0.1.0"
description = ""
authors = ["Andrey Bakulin <abakulin@auchan.ua>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-multipart = ">=0.0.20,<0.0.21"
fastapi = { extras = ["standart"], version = ">=0.117.1,<0.118.0" }
uvicorn = { extras = ["standart"], version = ">=0.37.0,<0.38.0" }
ldap3 = ">=2.9.1,<3.0.0"
pyjwt = "^2.9.0"
pydantic-settings = ">=2.11.0,<3.0.0"
pydantic = {extras = ["email"], version = "^2.12.3"}
sqlalchemy = ">=2.0.43,<3.0.0"
# Column-level encryption of personal data at rest (Fernet). Was previously only
# a transitive dependency, pulled in for RSA key generation.
cryptography = ">=43.0.0"
oracledb = ">=3.3.0,<4.0.0"
sshtunnel = ">=0.4.0,<0.5.0"
aiosqlite = "^0.21.0"
alembic = "^1.17.0"
celery = ">=5.5.3,<6.0.0"
flower = ">=2.0.1,<3.0.0"
redis = ">=5.0.0,<6.0.0"
aiosmtplib = ">=4.0.1,<5.0.0"
openpyxl = "^3.1.5"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"
orjson = "^3.11.8"
pillow = "^12.2.0"
matplotlib = "^3.11.0"
python-pptx = "^1.0.2"
# imported by backend/utils/rabbitmq.py (notification publishing)
aio-pika = "^9.6.2"
# imported by api_v1/review_session_employee/tempo_html.py (TEMPO HTML export)
jinja2 = "^3.1.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "migrations", "scripts", "seeds", "utils"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "PIE",    # flake8-pie
    "ISC",    # flake8-implicit-str-concat
    "TRY",    # tryceratops
    "DTZ",    # flake8-datetimez
    "ASYNC",  # flake8-async
    "FURB",   # refurb
    "PL",     # Pylint
    "PLC",    # Pylint conventions
    "PLE",    # Pylint errors
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "N818",   # exception names (project convention differs)
    "PLR09",  # too-many-* (subjective, review manually)
]
exclude = [
    "migrations/versions/*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
